root = "."
tmp_dir = ".tmp/air"

[build]
cmd = "mkdir -p ./.tmp/air"
entrypoint = ["./scripts/dev-wails.sh"]
include_ext = ["go"]
exclude_dir = [".git", ".tmp", ".tools", "build", "docs", "frontend", "graphify-out", "node_modules", "research", "scripts", "vendor"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 250
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
