services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cueflow
      POSTGRES_USER: cueflow
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cueflow -d cueflow"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - cueflow-postgres:/var/lib/postgresql/data

volumes:
  cueflow-postgres:
